name: nucleo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nucleo}
      POSTGRES_USER: ${POSTGRES_USER:-nucleo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nucleo_dev_password}

    ports:
      - "${POSTGRES_PORT:-5435}:5432"

    volumes:
      - nucleo_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  nucleo_postgres_data: