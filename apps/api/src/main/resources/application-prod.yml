spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      pool-name: NucleoProductionPool
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

        format_sql: false
        show_sql: false

  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${PORT:${SERVER_PORT:8090}}
  address: 0.0.0.0
  shutdown: graceful
  forward-headers-strategy: framework

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

    whitelabel:
      enabled: false

  compression:
    enabled: true
    mime-types:
      - application/json
      - application/problem+json
      - text/html
      - text/plain
      - text/css
      - application/javascript
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

security:
  jwt:
    issuer: ${JWT_ISSUER}
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}

app:
  web-url: ${APP_WEB_URL}

  invitations:
    ttl: ${INVITATION_TTL:7d}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    br.com.nucleo.api: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"