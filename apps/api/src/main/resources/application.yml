server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:nucleo-local-development-secret-key-with-at-least-32-chars}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}

spring:
  application:
    name: nucleo-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/nucleo}
    username: ${DATABASE_USERNAME:nucleo}
    password: ${DATABASE_PASSWORD:nucleo}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration