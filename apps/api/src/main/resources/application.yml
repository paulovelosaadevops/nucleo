spring:
  application:
    name: nucleo-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/nucleo}
    username: ${DB_USERNAME:nucleo}
    password: ${DB_PASSWORD:nucleo_dev_password}
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true