spring:
  application:
    name: nucleo-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/nucleo}
    username: ${DB_USERNAME:nucleo}
    password: ${DB_PASSWORD:nucleo_dev_password}
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

security:
  jwt:
    issuer: nucleo-api
    secret: ${JWT_SECRET:NUCLEO_DEV_SECRET_CHANGE_BEFORE_PRODUCTION_2026_64_CHARS_MINIMUM}
    access-token-ttl: 15m
    refresh-token-ttl: 30d

app:
  web-url: ${APP_WEB_URL:http://localhost:3000}

  invitations:
    ttl: 7d

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}