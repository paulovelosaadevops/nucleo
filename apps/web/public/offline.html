<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>N&uacute;cleo offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #050505;
        color: #f7f7f7;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top))
          max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.5rem, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.08), transparent 22rem),
          linear-gradient(180deg, #080809 0%, #050505 50%, #030303 100%);
      }

      main {
        max-width: 30rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1.5rem;
        background: rgba(9, 9, 9, 0.88);
        padding: 1.5rem;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }

      p {
        margin: 0;
        color: #a5a5aa;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>N&uacute;cleo</h1>
      <p>Voc&ecirc; est&aacute; sem conex&atilde;o. Reconecte-se para acessar os dados atualizados do N&uacute;cleo.</p>
    </main>
  </body>
</html>
